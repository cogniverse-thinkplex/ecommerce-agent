<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>消费分析</title><link rel="stylesheet" href="/account/spending/spending.css?v=20261023"><link rel="stylesheet" href="/customer-shell.css?v=20261024"></head><body>
<header data-customer-shell data-title="消费分析" data-back-label="返回客服中心"></header>
<main><header class="page-heading"><div><p>个人消费</p><h1>消费分析</h1><span>了解不同周期的消费趋势与商品类别构成。</span></div><div class="period-control" aria-label="统计周期"><button data-period="week">按周</button><button class="active" data-period="month">按月</button><button data-period="year">按年</button></div></header>
<aside class="demo-note">演示历史数据：订单日期由固定规则补齐，支付与退款金额来自当前零售数据。</aside>
<section class="metrics" aria-label="消费摘要"><article><span>净消费</span><strong id="net-spend">$0.00</strong></article><article><span>订单数</span><strong id="order-count">0</strong></article><article><span>平均订单金额</span><strong id="average-order">$0.00</strong></article><article><span>退款金额</span><strong id="refund-amount">$0.00</strong></article></section>
<section class="analysis-grid"><article class="panel"><header><h2>消费趋势</h2><span id="trend-caption"></span></header><div id="spending-trend" class="chart" aria-label="消费趋势图"></div></article><article class="panel"><header><h2>类别构成</h2></header><div id="category-chart" class="category-chart"></div></article></section>
<section class="orders"><header><h2>最近订单</h2></header><div class="table-wrap"><table><thead><tr><th>订单</th><th>日期</th><th>状态</th><th>净金额</th></tr></thead><tbody id="recent-orders"></tbody></table></div></section>
<p id="page-status" role="status"></p></main><script type="module" src="/customer-shell.js?v=20261026"></script><script type="module" src="/account/spending/spending.js?v=20261026"></script></body></html>
