<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>我的订单</title><link rel="stylesheet" href="/orders/orders.css?v=20261024-2"><link rel="stylesheet" href="/customer-shell.css?v=20261024"></head>
<body><header data-customer-shell data-title="我的订单" data-back-label="返回客服中心"></header>
<main><header class="page-heading"><div><p>账户中心</p><h1>我的订单</h1><span>查看购买记录，并让智能客服协助处理订单问题。</span></div><button id="assistant-toggle" type="button">打开订单助手</button></header>

<div id="assistant-scrim" class="assistant-scrim" hidden></div><script type="module" src="/customer-shell.js?v=20261026"></script><script type="module" src="/orders/orders.js?v=20261026"></script></body></html>
