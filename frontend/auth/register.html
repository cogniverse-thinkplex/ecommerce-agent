<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f7f4"><title>创建账户 · 电商服务中心</title><link rel="stylesheet" href="/auth/auth.css?v=20261023-ac"></head>
<body data-page="register">
<main class="auth-shell auth-shell-register">
  <section class="auth-visual" aria-label="电商服务中心"><div class="visual-header"><span class="brand-mark" aria-hidden="true">E</span><span>电商服务中心</span></div><div class="visual-copy"><p>从下单到售后</p><h1>每一次服务，<br>都从了解您开始。</h1></div></section>
  <section class="auth-panel" aria-labelledby="page-title"><div class="auth-content">
    <div class="auth-heading"><span class="eyebrow">新用户</span><h2 id="page-title">创建账户</h2><p>保存您的对话与服务记录。</p></div>
    <form id="auth-form" novalidate>
      <div class="field"><label for="display-name">姓名</label><input id="display-name" name="display_name" autocomplete="name" placeholder="您的姓名" required></div>
      <div class="field"><label for="email">邮箱</label><input id="email" name="email" type="email" autocomplete="username" inputmode="email" placeholder="name@example.com" required></div>
      <div class="field"><label for="password">密码</label><div class="password-field"><input id="password" name="password" type="password" autocomplete="new-password" minlength="12" placeholder="至少 12 位" aria-describedby="password-help" required><button class="password-toggle" type="button" data-password-toggle="password" aria-label="显示密码" aria-pressed="false"><span aria-hidden="true">显示</span></button></div><small id="password-help">包含大小写字母、数字和符号。</small></div>
      <div class="field"><label for="password-confirm">确认密码</label><div class="password-field"><input id="password-confirm" name="password_confirm" type="password" autocomplete="new-password" minlength="12" placeholder="再次输入密码" required><button class="password-toggle" type="button" data-password-toggle="password-confirm" aria-label="显示确认密码" aria-pressed="false"><span aria-hidden="true">显示</span></button></div></div>
      <p id="form-error" class="form-error" role="alert" tabindex="-1" hidden></p>
      <button class="submit-button" type="submit" data-label="创建账户" data-pending-label="正在创建…"><span>创建账户</span></button>
    </form>
    <p class="auth-link">已有账户？<a href="/login/">返回登录</a></p>
  </div><p class="auth-footer">安全连接 · 会话信息仅用于提供服务</p></section>
</main><script type="module" src="/auth/auth.js?v=20261023-ac"></script>
</body></html>
