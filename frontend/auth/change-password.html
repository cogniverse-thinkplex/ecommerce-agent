<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f7f4"><title>设置新密码 · 电商服务中心</title><link rel="stylesheet" href="/auth/auth.css?v=20261023-ac"></head>
<body data-page="change-password">
<main class="auth-shell">
  <section class="auth-visual" aria-label="电商服务中心"><div class="visual-header"><span class="brand-mark" aria-hidden="true">E</span><span>电商服务中心</span></div><div class="visual-copy"><p>账户安全</p><h1>保护您的订单<br>与服务记录。</h1></div></section>
  <section class="auth-panel" aria-labelledby="page-title"><div class="auth-content">
    <div class="auth-heading"><span class="eyebrow">安全设置</span><h2 id="page-title">设置新密码</h2><p>首次使用前，请更换临时密码。</p></div>
    <form id="auth-form" novalidate>
      <div class="field"><label for="current-password">当前密码</label><div class="password-field"><input id="current-password" name="current_password" type="password" autocomplete="current-password" placeholder="输入当前密码" required><button class="password-toggle" type="button" data-password-toggle="current-password" aria-label="显示当前密码" aria-pressed="false"><span aria-hidden="true">显示</span></button></div></div>
      <div class="field"><label for="new-password">新密码</label><div class="password-field"><input id="new-password" name="new_password" type="password" autocomplete="new-password" minlength="12" placeholder="至少 12 位" aria-describedby="password-help" required><button class="password-toggle" type="button" data-password-toggle="new-password" aria-label="显示新密码" aria-pressed="false"><span aria-hidden="true">显示</span></button></div><small id="password-help">包含大小写字母、数字和符号。</small></div>
      <div class="field"><label for="password-confirm">确认新密码</label><div class="password-field"><input id="password-confirm" name="password_confirm" type="password" autocomplete="new-password" minlength="12" placeholder="再次输入新密码" required><button class="password-toggle" type="button" data-password-toggle="password-confirm" aria-label="显示确认密码" aria-pressed="false"><span aria-hidden="true">显示</span></button></div></div>
      <p id="form-error" class="form-error" role="alert" tabindex="-1" hidden></p>
      <button class="submit-button" type="submit" data-label="保存新密码" data-pending-label="正在保存…"><span>保存新密码</span></button>
    </form>
  </div><p class="auth-footer">安全连接 · 密码将经过加密保存</p></section>
</main><script type="module" src="/auth/auth.js?v=20261023-ac"></script>
</body></html>
